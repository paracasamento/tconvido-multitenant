name: Install generated theme assets

on:
  push:
    branches: [main]
    paths:
      - ".theme-assets/**"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild generated WebP asset bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .theme-assets/chunk-00 ]; then
            echo "No asset chunks present; nothing to install."
            exit 0
          fi

          cat .theme-assets/chunk-* > /tmp/tconvido-theme-assets.b64
          base64 --decode /tmp/tconvido-theme-assets.b64 > /tmp/tconvido-theme-assets.tar.gz
          tar -xzf /tmp/tconvido-theme-assets.tar.gz -C .
          rm -rf .theme-assets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/themes .theme-assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install generated invitation theme assets"
          git push
