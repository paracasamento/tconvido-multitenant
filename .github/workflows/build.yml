name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/tconvido
      APP_SECURITY_SECRET: ci-build-placeholder-secret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate multievent matrix
        run: npm run check:multievent

      - name: Validate security invariants
        run: npm run check:security-invariants

      - name: Build
        run: npm run build
